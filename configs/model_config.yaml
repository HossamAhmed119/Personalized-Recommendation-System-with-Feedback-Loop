# ============================================
# CF Models Configuration
# Location: configs/model_config.yaml
# Only contains parameters, no paths logic
# ============================================

experiment:
  name: "CF_Models_Comparison_20M"
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/val.parquet"
  test_path: "data/processed/test.parquet"

evaluation:
  k: 10
  n_sample_users: 5000
  random_state: 42

models:
  common:
    random_state: 42
  
  ALS:
    factors: 64
    regularization: 0.1
    iterations: 20
  
  BPR:
    factors: 64
    learning_rate: 0.01
    regularization: 0.01
    iterations: 100
  
  SVD:
    n_components: 64
  
  ItemKNN:
    n_neighbors: 20
    metric: "cosine"
    algorithm: "brute"

paths:
  reports_dir: "reports/"
  comparison_plot: "model_comparison.png"
  time_plot: "model_time_comparison.png"
  results_csv: "model_comparison_results.csv"
